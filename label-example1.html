<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessibility exercise</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f8;
      color: #333;
      margin: 0;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header */
    h1 {
      color: #2a9d8f;
      margin-bottom: 20px;
    }

    /* Form container */
    form {
      background-color: #fff;
      padding: 25px 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      max-width: 450px;
      width: 100%;
    }

    /* Fieldset and legend */
    fieldset {
      border: 2px solid #2a9d8f;
      border-radius: 8px;
      padding: 20px;
    }

    legend {
      font-weight: bold;
      color: #264653;
      padding: 0 10px;
    }

    /* Form controls */
    .form-control {
      display: flex;
      flex-direction: column;
      margin-bottom: 15px;
    }

    label {
      margin-bottom: 6px;
      font-weight: 500;
      color: #264653;
    }

    /* Inputs and textarea */
    input[type="text"],
    input[type="email"],
    textarea {
      padding: 10px;
      border: 2px solid #757575;
      border-radius: 6px;
      font-size: 1em;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    textarea:focus {
      border-color: #1E7167;
      box-shadow: 0 0 5px rgba(42, 157, 143, 0.3);
      outline: none;
    }

    /* Submit button */
    input[type="submit"],
    button[type="submit"] {
      background-color: #20796F;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    input[type="submit"]:hover,
    button[type="submit"]:hover {
      background-color: #21867a;
    }

    /* Screen reader only utility (accessible text hiding) */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Contact info */
    .contact-info {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 25px;
    }

    .contact-info img {
      width: 20px;
      height: 20px;
      margin-right: 8px;
    }

    label img {
      width: 20px;
      height: 20px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <header>
    <h1>Accessibility exercises</h1>
  </header>
  <main>
    <h2>ARIA exercise 1 (after)</h2>

    <form>
      <fieldset>
        <legend>Contact us</legend>
        <div class="form-control">
          <label for="name">
            <span class="sr-only">Name</span>
            <img src="https://img.icons8.com/small/2x/user.png" alt="" aria-hidden="true" />
          </label>
          <input type="text" id="name" name="name" autocomplete="name" />
        </div>

        <div class="form-control">
          <label for="email">
            <span class="sr-only">e-mail</span>
            <img src="https://img.icons8.com/small/2x/email.png" alt="" aria-hidden="true" />
          </label>
          <input type="email" id="email" name="email" autocomplete="email" />
        </div>

        <div class="form-control">
          <label for="message">
            <span class="sr-only">Message</span>
            <img src="https://img.icons8.com/small/2x/speech-bubble.png" alt="" aria-hidden="true" />
          </label>
          <textarea id="message" name="message" cols="30" rows="10"></textarea>
        </div>

        <button type="submit">Send</button>
      </fieldset>
    </form>

    <p class="contact-info">
      <img alt="" aria-hidden="true" src="https://img.icons8.com/small/2x/phone.png" />
      <span class="sr-only">Phone: </span>+52 (333) 45 34 567
    </p>
  </main>
</body>
</html>
